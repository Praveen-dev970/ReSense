<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <style>

    div.container{border-style: double;
    /*background-image: linear-gradient(to right, purple,orange,yellow,green,blue,indigo,violet);*/
	background-color:skyblue;

    div.friend2field{
      font-weight: bold;
      display: grid;
      grid-template-columns: 1fr 3fr;
    }
    body {
      background-image: linear-gradient(to right, purple,cornsilk,lavender,green,cyan,khaki,pink);;
    }

    .btn{
      float:right;
      font-weight: bold;
      border: 5px solid #555555;



    }


    </style>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

    <title>Autism Prediction</title>
  </head>
  <body style="background-color:pink;">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <a class="navbar-brand" href="">Autism Prediction System</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNavDropdown">
    <ul class="navbar-nav">
      <li class="nav-item active">
        <a class="nav-link" href="/">Home <span class="sr-only">(current)</span></a>
      </li>

    </ul>
  </div>

</nav>


<div class="alert alert-success alert-dismissible fade show" role="alert">
  <strong style="font-size:35px;">User Registration Form</strong>
  <button type="button" class="close" data-dismiss="alert" aria-label="Close">
    <span aria-hidden="true">×</span>
  </button>
</div>

<div class="container">

  <form action='/registration/' method='post'>
    {% csrf_token %}
      <div class="friend2field">
      <label for="name">Enter Name</label>
      <input  name="name" id="name" type="text" placeholder="Enter Name" required>
      </div>
    <br>
      <div class="friend2field">
      <label for="mailid">Enter Mail Id</label>
      <input  name="mailid" id="mailid" type="text" placeholder="Enter Mail Id" required>
      </div>
    <br>
      <div class="friend2field">
      <label for="mobileno">Enter Mobile no</label>
      <input  name="mobileno" id="mobileno" type="text" placeholder="Enter Mobile no" required>
      </div>
    <br>
    <div class="friend2field">
      <label for="uid">Enter Username:</label>
      <input  name="uid" id="uid" type="text" placeholder="Enter Username" required>
    </div>
    <br>
    <div class="friend2field">
      <label for="pwd">Enter Password:</label>
      <input  name="pwd" id="pwd" type="password" placeholder="Enter Password" required>
    </div>

    <br>

<div class="">
      <label for=""></label>
      <button type="submit" class="btn btn-info mt-">Register</button>
    </div>
    <br>


    </form>
  <h4 style="color:blue">{{msg}}</h4>
</div>


    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js" integrity="sha384-wHAiFfRlMFy6i5SRaxvfOCifBUQy1xHdJ/yoi7FRNXMRBu5WHdZYu1hA6ZOblgut" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js" integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k" crossorigin="anonymous"></script>
  </body>
</html>
