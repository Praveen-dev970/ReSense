{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReSense – Upload Videos (Admin)</title>
  <link rel="icon" type="image/png" href="{% static 'assets/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'css/resense.css' %}">
</head>
<body>

<!-- Navigation Bar -->
<header class="resense-navbar">
  <div class="resense-nav-container">
    <a href="/analyze1/" class="resense-brand">
      <div class="resense-brand-logo">
        <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" fill="#5E35B1"/>
          <path d="M14 16C14 13.7909 15.7909 12 18 12C19.1046 12 20 12.8954 20 14C20 15.1046 20.8954 16 22 16C24.2091 16 26 17.7909 26 20C26 21.1046 25.1046 22 24 22C22.8954 22 22 22.8954 22 24C22 26.2091 20.2091 28 18 28C15.7909 28 14 26.2091 14 24C14 22.8954 14.8954 22 16 22C17.1046 22 18 21.1046 18 20C18 18.8954 17.1046 18 16 18C14.8954 18 14 17.1046 14 16Z" fill="#A78BFA"/>
          <path d="M22 14C23.1046 14 24 13.1046 24 12C26.2091 12 28 13.7909 28 16C28 17.1046 27.1046 18 26 18C26 19.1046 26.8954 20 28 20C28 22.2091 26.2091 24 24 24" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="16" cy="19" r="1.5" fill="#FDE047"/>
          <circle cx="24" cy="21" r="1.5" fill="#F43F5E"/>
        </svg>
      </div>
      <span>ReSense</span>
    </a>

    <button class="resense-nav-toggle" id="navToggle" aria-label="Toggle navigation">
      &#9776;
    </button>

    <nav>
      <ul class="resense-nav-menu" id="navMenu">
        <li class="resense-nav-item">
          <a class="resense-nav-link active" href="/analyze1/">Upload Videos</a>
        </li>
        <li class="resense-nav-item">
          <a class="resense-nav-link" href="/analyze3/">View Videos</a>
        </li>
        <li class="resense-nav-item">
          <a class="resense-nav-link" href="{% url 'admin_screenings' %}">View Screening Records</a>
        </li>
        <li class="resense-nav-item">
          <form method="post" action="{% url 'logout' %}" class="resense-nav-form">
            {% csrf_token %}
            <button type="submit" class="resense-nav-link">Logout</button>
          </form>
        </li>
      </ul>
    </nav>
  </div>
</header>

<!-- Main Admin Video Upload Content -->
<main class="resense-page-container resense-page-compact">

  <div class="resense-card">

    <div class="resense-card-header">
      <div class="resense-card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
      </div>
      <div class="resense-card-title-group">
        <h2>Administrator Video Management</h2>
        <p>Upload video files for dataset library and system repository.</p>
      </div>
    </div>

    <form action="/analyze2" method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="resense-form-group">
        <label class="resense-label" for="fi1">Select Video File</label>
        <input class="resense-input" type="file" name="fi1" id="fi1" accept="video/*" required style="padding: 10px;">
      </div>

      <div class="resense-form-group" style="margin-bottom: 28px;">
        <label class="resense-label" for="descr">Video Description</label>
        <textarea class="resense-textarea" name="descr" id="descr" rows="4" placeholder="Enter video description (e.g. Free play activity, interaction with toys, stimming behavior sample)" required></textarea>
      </div>

      <button type="submit" class="resense-btn resense-btn-primary" style="padding: 13px 28px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        Submit Video
      </button>

      <a href="/analyze3/" class="resense-btn resense-btn-secondary" style="margin-left: 10px;">
        Cancel
      </a>
    </form>

  </div>

</main>

<script>
  document.getElementById('navToggle').addEventListener('click', function() {
    document.getElementById('navMenu').classList.toggle('show');
  });
</script>

</body>
</html>
