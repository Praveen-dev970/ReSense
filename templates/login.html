{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReSense – Administrator Login</title>
  <link rel="icon" type="image/png" href="{% static 'assets/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'css/resense.css' %}">
</head>
<body>

<!-- Navigation Bar -->
<header class="resense-navbar">
  <div class="resense-nav-container">
    <a href="/" class="resense-brand">
      <div class="resense-brand-logo">
        <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" fill="#5E35B1"/>
          <path d="M14 16C14 13.7909 15.7909 12 18 12C19.1046 12 20 12.8954 20 14C20 15.1046 20.8954 16 22 16C24.2091 16 26 17.7909 26 20C26 21.1046 25.1046 22 24 22C22.8954 22 22 22.8954 22 24C22 26.2091 20.2091 28 18 28C15.7909 28 14 26.2091 14 24C14 22.8954 14.8954 22 16 22C17.1046 22 18 21.1046 18 20C18 18.8954 17.1046 18 16 18C14.8954 18 14 17.1046 14 16Z" fill="#A78BFA"/>
          <path d="M22 14C23.1046 14 24 13.1046 24 12C26.2091 12 28 13.7909 28 16C28 17.1046 27.1046 18 26 18C26 19.1046 26.8954 20 28 20C28 22.2091 26.2091 24 24 24" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="16" cy="19" r="1.5" fill="#FDE047"/>
          <circle cx="24" cy="21" r="1.5" fill="#F43F5E"/>
        </svg>
      </div>
      <span>ReSense</span>
    </a>

    <button class="resense-nav-toggle" id="navToggle" aria-label="Toggle navigation">
      &#9776;
    </button>

    <nav>
      <ul class="resense-nav-menu" id="navMenu">
        <li class="resense-nav-item">
          <a class="resense-nav-link" href="/">Home</a>
        </li>
        <li class="resense-nav-item">
          <a class="resense-nav-link active" href="/login1">Admin</a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<!-- Main Admin Login Container -->
<main class="resense-page-container">
  <div class="resense-card" style="max-width: 980px; margin: 30px auto; padding: 40px 48px;">

    <div class="resense-split-grid">

      <!-- Left Hero Column (Administrator Illustration) -->
      <div class="resense-hero-visual">
        <div class="resense-hero-illustration">
          <img src="{% static 'assets/admin.png' %}" alt="ReSense Administrator Login Illustration" style="width: 100%; height: auto; max-height: 220px; object-fit: contain; display: block; margin: 0 auto;">
        </div>

        <h1 class="resense-hero-title">Administrator Access</h1>
        <p class="resense-hero-subtitle">
          Manage videos, screening records, and system content.
        </p>
      </div>

      <!-- Right Form Column (Admin Login) -->
      <div style="background: #fafbff; border: 1px solid #e8ecf8; border-radius: 18px; padding: 36px 32px;">

        <div style="text-align: center; margin-bottom: 24px;">
          <div style="width: 56px; height: 56px; border-radius: 50%; background: #ede9fe; color: #5e35b1; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h2 style="margin: 0; font-size: 1.5rem; font-weight: 700; color: #161c3d;">Admin Login</h2>
        </div>

        {% if msg %}
        <div class="resense-alert resense-alert-danger" role="alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ msg }}</span>
        </div>
        {% endif %}

        <form action="/login1" method="post">
          {% csrf_token %}

          <div class="resense-form-group">
            <label class="resense-label" for="uid">Username</label>
            <div class="resense-input-wrapper">
              <span class="resense-input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input class="resense-input" name="uid" id="uid" type="text" placeholder="Enter admin username" required autocomplete="username">
            </div>
          </div>

          <div class="resense-form-group" style="margin-bottom: 28px;">
            <label class="resense-label" for="pwd">Password</label>
            <div class="resense-input-wrapper">
              <span class="resense-input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input class="resense-input" name="pwd" id="pwd" type="password" placeholder="Enter admin password" required autocomplete="current-password">
              <button type="button" class="resense-password-toggle" id="toggleAdminPassword" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="resense-btn resense-btn-primary resense-btn-block" style="padding: 13px;">
            Login
          </button>
        </form>

        <div style="text-align: center; margin-top: 22px; font-size: 0.925rem; color: #526079;">
          <a href="/" style="color: #64748b;">&larr; Back to User Login</a>
        </div>

      </div>

    </div>

  </div>
</main>

<script>
  document.getElementById('navToggle').addEventListener('click', function() {
    document.getElementById('navMenu').classList.toggle('show');
  });

  const toggleBtn = document.getElementById('toggleAdminPassword');
  const pwdInput = document.getElementById('pwd');
  if (toggleBtn && pwdInput) {
    toggleBtn.addEventListener('click', function() {
      const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
      pwdInput.setAttribute('type', type);
    });
  }
</script>

</body>
</html>
