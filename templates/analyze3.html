
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>View Videos - ReSense</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: pink;
        }

        .container {
            background-color: skyblue;
            border: double;
            margin-top: 25px;
            padding: 20px;
        }

        table {
            width: 100%;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            vertical-align: middle;
        }

        video {
            max-width: 200px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="">Autism Prediction System</a>

    <div class="navbar-nav">
        <a class="nav-link" href="/analyze1/">Upload Videos</a>
        <a class="nav-link active" href="/analyze3/">View Videos</a>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="nav-link btn btn-link">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>Welcome to Autism Prediction!</strong>
    Autism Video Content

    <button type="button" class="close" data-dismiss="alert">
        <span>&times;</span>
    </button>
</div>

<div class="container">

    <h4 class="text-center">VIDEO FILES DETAILS</h4>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Video</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% load static %}

            {% for row in data %}
            <tr>
                <td>{{ row.0 }}</td>

                <td>
                    <video controls>
                        <source
                            src="{% static 'uploads/' %}{{ row.1 }}"
                            type="video/mp4">
                    </video>
                </td>

                <td>{{ row.2 }}</td>

                <td>
                    <form method="POST" action="/analyze3/">
                        {% csrf_token %}

                        <input type="hidden"
                               name="video_id"
                               value="{{ row.0 }}">

                        <button type="submit"
                                class="btn btn-danger"
                                onclick="return confirm('Are you sure you want to permanently delete this video?');">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>

            {% empty %}
            <tr>
                <td colspan="4">No videos available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js"></script>

</body>
</html>
